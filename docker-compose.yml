services:
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run neon deploy to populate DATABASE_URL in .env}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Run neon deploy to populate DATABASE_URL_UNPOOLED in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:-}
      NEON_AUTH_JWKS_URL: ${NEON_AUTH_JWKS_URL:-}
      PORT: ${PORT:-8000}
    ports:
      - "${HOST_PORT:-8001}:${PORT:-8000}"
