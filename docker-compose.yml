services:
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@db:5432/app_db
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: