services:
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run neon deploy to populate DATABASE_URL in .env}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?Run neon deploy to populate DATABASE_URL_UNPOOLED in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:?Run neon deploy to populate NEON_AUTH_BASE_URL in .env}
      NEON_AUTH_JWKS_URL: ${NEON_AUTH_JWKS_URL:?Run neon deploy to populate NEON_AUTH_JWKS_URL in .env}
      PORT: ${PORT:-8000}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
